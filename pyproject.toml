[project]
name = "mbpost2mztabm"
version = "0.1.0"
description = "Client for the MB-POST public API and conversion to mzTab-M"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mbpost2mztabm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
